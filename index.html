<style>
:root{
  --navy:#0B1F3A; --navy-deep:#05112A; --ink:#0B1F3A; --muted:#5B6B82;
  --line:#E3E8F0; --bg:#FFFFFF; --soft:#F4F6FA; --green:#1F9D6B; --amber:#E8A317;
  --blue:#2F6BFF; --rose:#D9455F; --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);line-height:1.45;min-height:100vh}
body.hasnav{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.view{display:none}.view.active{display:block}.hide{display:none}
.muted{color:var(--muted)}

/* hero (home + mock) */
.hero{background:var(--navy);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 0 26px;border-radius:0 0 28px 28px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.2px}
.logo{width:38px;height:38px;object-fit:contain;flex:none}
.acctbtn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);padding:6px 12px 6px 6px;border-radius:99px;font-size:13px;font-weight:600;color:#fff}
.acctbtn i{width:26px;height:26px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.2}
.sub{color:#B9C6DB;font-size:14px;margin-top:4px}
.back{display:inline-flex;align-items:center;gap:6px;color:#fff;font-weight:700;font-size:14px;margin-bottom:16px;padding:6px 0}
.streak{display:inline-flex;gap:6px;margin-top:14px;font-size:13px;color:#B9C6DB}
.streak b{color:#fff}
.continue{margin-top:20px;background:#fff;color:var(--ink);border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.continue .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff}
.continue .t{font-weight:700;font-size:15px}.continue .s{font-size:13px;color:var(--muted)}
.continue .go{margin-left:auto;background:var(--navy);color:#fff;border-radius:99px;padding:9px 16px;font-size:13px;font-weight:700}

h2{font-size:18px;font-weight:800;margin:26px 0 12px;letter-spacing:-.2px}
.btn{background:var(--navy);color:#fff;border-radius:12px;padding:12px 18px;font-weight:700;font-size:14px}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.danger{background:var(--rose)}
.btn.full{width:100%;padding:14px}

.save{margin:18px 0 0;border:1.5px solid var(--line);border-radius:var(--r);padding:14px;display:none;gap:12px;align-items:center;background:var(--soft)}
.save.show{display:flex}
.save p{font-size:13px;color:var(--muted);flex:1}.save p b{display:block;color:var(--ink);font-size:14px}
.save .x{color:var(--muted);font-size:20px;padding:4px 8px}

.list{display:grid;gap:12px}
.card{display:flex;gap:14px;align-items:center;padding:16px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;text-align:left;width:100%;transition:transform .12s,border-color .12s}
.card:active{transform:scale(.985)}.card:hover{border-color:var(--navy)}
.card .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none;color:#fff}
.card .body{flex:1;min-width:0}.card .name{font-weight:800;font-size:16px}
.card .desc{font-size:13px;color:var(--muted);margin-top:1px}
.pill{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--soft)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:#9AA7BA}
.pill.live{background:#E6F6EF;color:#14724D}.pill.live::before{background:var(--green)}
.pill.wait{background:#FFF4DB;color:#8A5B00}.pill.wait::before{background:var(--amber)}
.chev{color:#9AA7BA;flex:none}
.ic.practice{background:var(--blue)}.ic.weekly{background:var(--green)}.ic.mock{background:var(--navy)}.ic.compete{background:var(--amber)}

/* mock dashboard */
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.cd div{background:rgba(255,255,255,.1);border-radius:14px;padding:12px 4px;text-align:center}
.cd b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.cd span{font-size:11px;color:#B9C6DB}
.panel{border:1.5px solid var(--line);border-radius:var(--r);padding:16px;margin-top:16px}
.panel.live{border-color:var(--green);background:#F2FBF7}
.panel h3{font-size:16px;font-weight:800}.panel p{font-size:13px;color:var(--muted);margin:4px 0 12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.stat{background:var(--soft);border-radius:var(--r);padding:14px}
.stat b{font-size:24px;font-weight:800;display:block}.stat span{font-size:12px;color:var(--muted)}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:10px;width:100%;text-align:left}
.hrow .m{font-weight:700;font-size:14px}.hrow .d{font-size:12px;color:var(--muted)}
.hrow .sc{font-weight:800}
.empty{text-align:center;padding:28px 10px;color:var(--muted);font-size:14px}
.empty h3{color:var(--ink);font-size:16px;margin-bottom:4px}

/* subject picker */
.sitem{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:10px;width:100%;text-align:left}
.sitem.sel{border-color:var(--navy);background:#F1F5FC}
.sitem.locked{opacity:.85}
.sitem .n{font-weight:700}.sitem .tg{font-size:12px;color:var(--muted)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff}
.sitem.sel .chk{background:var(--navy);border-color:var(--navy)}
.field{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:15px;background:#fff}
.field:focus{outline:none;border-color:var(--navy)}
.stickybar{position:sticky;bottom:0;background:#fff;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-top:16px}

/* exam */
#view-exam{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.xbar{position:sticky;top:0;z-index:15;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px}
.xbar .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.xbar .sj{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:10px}
.timer.low{background:var(--rose)}
.pbtn{background:#fff;color:var(--navy);border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px}
.prog{height:4px;background:rgba(255,255,255,.18);margin-top:10px;border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:#fff;width:0;transition:width .2s}
.stabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.stabs::-webkit-scrollbar{display:none}
.stab{flex:none;padding:8px 13px;border-radius:99px;border:1.5px solid var(--line);font-size:12px;font-weight:700;color:var(--muted);background:#fff}
.stab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.qmeta{font-size:13px;color:var(--muted);margin:14px 0 8px;font-weight:600}
.qtext{font-size:17px;font-weight:600;line-height:1.5;margin-bottom:16px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;background:#fff}
.opt .l{width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.opt.sel{border-color:var(--navy);background:#F1F5FC}.opt.sel .l{background:var(--navy);color:#fff}
.actionbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));z-index:15}
.actionbar .in{max-width:560px;margin:0 auto;padding:0 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;background:var(--amber);color:#fff;display:none;place-items:center;box-shadow:0 6px 18px rgba(11,31,58,.25);z-index:16}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.pq{aspect-ratio:1;border-radius:10px;border:1.5px solid var(--line);font-weight:700;font-size:13px;background:#fff}
.pq.ans{background:var(--navy);border-color:var(--navy);color:#fff}
.pq.cur{outline:3px solid var(--blue);outline-offset:1px}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.calc button{padding:16px 0;border-radius:12px;background:var(--soft);font-weight:700;font-size:18px}
.calc button.op{background:#E1E9FA;color:var(--navy)}.calc button.eq{background:var(--navy);color:#fff}
.calcscr{background:var(--navy);color:#fff;border-radius:12px;padding:14px;text-align:right;font-size:28px;font-weight:700;overflow:hidden;font-variant-numeric:tabular-nums;min-height:60px}

/* results / review / board */
.scorebox{text-align:center;padding:28px 16px}
.scorebox b{font-size:54px;font-weight:800;letter-spacing:-1px;display:block}
.bk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.rev{border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.rev .q{font-weight:600;margin-bottom:8px}
.rev .o{padding:8px 10px;border-radius:10px;font-size:14px;margin-top:6px;background:var(--soft)}
.rev .o.correct{background:#E6F6EF;color:#14724D;font-weight:700}
.rev .o.wrong{background:#FDE8EC;color:#A02A40;font-weight:700}
.lb{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);margin-bottom:8px}
.lb.mine{border-color:var(--navy);background:#F1F5FC}
.lb .rk{width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:13px}
.lb .rk.t1{background:var(--amber);color:#fff}
.lb .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .sc{font-weight:800}

/* practice */
a.btn{display:block;text-align:center;text-decoration:none}
.btn.amber{background:var(--amber);color:#fff}
.btn.sm{padding:9px 14px;font-size:13px;border-radius:10px}
.banner{display:flex;gap:12px;align-items:center;background:#FFF4DB;border:1.5px solid #F3D48A;border-radius:var(--r);padding:14px;margin-top:16px}
.banner h3{font-size:15px;font-weight:800}.banner p{font-size:13px;color:#6B4B00;margin-top:2px}
.tcard{display:flex;gap:14px;align-items:center;padding:14px;border:1.5px solid var(--line);border-radius:var(--r);margin-bottom:10px}
.tnum{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-weight:800;flex:none;color:var(--navy)}
.tinfo{flex:1;min-width:0}.tinfo h3{font-size:15px;font-weight:800}.tinfo p{font-size:12.5px;color:var(--muted)}
.badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;flex:none}
.badge.open{background:#E6F6EF;color:#14724D}.badge.closing{background:#FFF4DB;color:#8A5B00}.badge.closed{background:var(--soft);color:var(--muted)}
.ch{border:1.5px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.ch .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.ch h3{font-size:16px;font-weight:800}
.ch .d{font-size:13px;color:var(--muted);margin:6px 0 12px}
.ch .meta{display:flex;gap:28px;margin-bottom:12px}.ch .meta b{display:block;font-size:14px}.ch .meta span{color:var(--muted);font-size:12px}
.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden;margin:6px 0 4px}.bar i{display:block;height:100%;background:var(--green)}
.ptext{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.price{font-size:46px;font-weight:800;letter-spacing:-1px;margin-top:8px}.price small{font-size:13px;color:var(--muted);font-weight:600;display:block;letter-spacing:0}
.plist{list-style:none;margin:16px 0 22px}.plist li{padding:8px 0 8px 28px;position:relative;font-size:14px}.plist li::before{content:"\2713";position:absolute;left:0;color:var(--green);font-weight:800}
.pinbox{background:var(--soft);border-radius:var(--r);padding:20px;text-align:center;margin:16px 0}.pinbox b{font-size:26px;letter-spacing:2px;display:block;margin:6px 0 12px}
select.field{appearance:auto}

/* weekly */
#view-wquiz,#view-lquiz{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc2{position:relative;display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:14px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;text-align:left}
.sc2:active{transform:scale(.985)}
.sc2 .si{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--navy)}
.sc2 .sn{font-weight:800;font-size:14.5px}.sc2 .ss{font-size:12px;color:var(--muted)}
.sc2.locked{opacity:.6}
.sc2 .lk{position:absolute;top:12px;right:12px;color:var(--muted)}
.b3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 12px}
.rev .o.picked{outline:2px solid var(--navy)}
.yourrank{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin-top:10px}

/* challenge */
.prizes .lb{padding:14px}.prizes .sc{font-size:16px}
.joinbtn{display:block;text-align:center;margin-top:10px}
.rules{list-style:none;margin:10px 0 0}.rules li{padding:7px 0 7px 26px;position:relative;font-size:14px;color:var(--ink)}
.rules li::before{content:"";position:absolute;left:6px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--navy)}
.lb .tm{font-size:12px;color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}
.lb .pz{font-size:11px;font-weight:800;background:#FFF4DB;color:#8A5B00;border-radius:99px;padding:3px 8px;margin-right:6px}

/* lekki headmaster */
.ic.novel{background:var(--rose)}
.tabs3{grid-template-columns:repeat(3,1fr)}
button.tcard{width:100%;text-align:left;background:#fff;font:inherit}
button.tcard:active{transform:scale(.985)}
.summary p{margin:0 0 14px;font-size:15.5px;line-height:1.7}
audio{width:100%;margin-top:6px}
.cast{border:1.5px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.cast .nm2{font-weight:800;font-size:15.5px}
.cast .rl{display:inline-block;font-size:11.5px;font-weight:700;background:var(--soft);color:var(--muted);padding:3px 9px;border-radius:99px;margin-left:8px;vertical-align:middle}
.cast p{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.55}
.cast .cc{font-size:12px;color:var(--muted);margin-top:8px}
.cast .tx p{font-size:14.5px;color:#33445C;line-height:1.7;margin:10px 0 0}
.mins{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 12px}
.mins .stab{min-width:64px;text-align:center}
.minput{display:flex;align-items:center;gap:10px;margin-bottom:14px}.minput input{width:90px}
.rev .ex{margin-top:8px;font-size:13px;color:var(--muted);background:var(--soft);padding:9px 10px;border-radius:10px}
.chnav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}

.zen{display:inline-block;flex:none;width:76px;height:76px;background:var(--zen) center/contain no-repeat}
.zen-sm{width:54px;height:54px}.zen-lg{width:128px;height:128px}
.zen-disc{background-color:#fff;background-size:88%;border-radius:50%}
.zen-disc2{background-color:var(--soft);background-size:88%;border-radius:50%}
@media (prefers-reduced-motion:no-preference){.zen-bob{animation:zbob 3.4s ease-in-out infinite}}
@keyframes zbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.zenrow{display:flex;align-items:center;gap:12px;margin-top:16px}
.zenrow .zen{cursor:pointer}
.bubble{position:relative;flex:1;text-align:left;background:rgba(255,255,255,.13);color:#fff;border-radius:16px;padding:12px 14px;font-size:13.5px;line-height:1.5;font-weight:600}
.bubble::before{content:"";position:absolute;left:-7px;top:50%;margin-top:-7px;border:7px solid transparent;border-left:0;border-right-color:rgba(255,255,255,.13)}
.zensay{display:flex;align-items:center;gap:12px;margin:14px 0 6px}
.zensay .bub{position:relative;flex:1;background:var(--soft);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.55;color:var(--ink)}
.zensay .bub::before{content:"";position:absolute;left:-7px;top:50%;margin-top:-7px;border:7px solid transparent;border-left:0;border-right-color:var(--soft)}
.zenhead{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.zenhead h1,.zenhead h3{margin:0}
.newtag{display:inline-block;margin-left:8px;font-size:10.5px;font-weight:800;background:var(--amber);color:#fff;padding:2px 8px;border-radius:99px;vertical-align:middle;letter-spacing:.2px}
.empty.z::before{content:"";display:block;width:88px;height:88px;margin:0 auto 8px;background:var(--zen) center/contain no-repeat}

/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:20;display:none}
body.hasnav nav{display:block}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);border-radius:12px}
nav button.on{color:var(--navy)}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,17,42,.55);display:none;z-index:30;align-items:flex-end;justify-content:center}
.scrim.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out;max-height:92vh;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-size:21px;font-weight:800;letter-spacing:-.3px}
.sheet .why{color:var(--muted);font-size:14px;margin:6px 0 16px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{padding:10px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(11,31,58,.12)}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:14px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{font-size:13px;margin-top:10px;min-height:18px;color:var(--rose)}.msg.ok{color:#14724D}
.close{float:right;font-size:26px;color:var(--muted);padding:0 6px;line-height:1}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span{color:var(--muted)}
.linkbtn{color:var(--blue);font-weight:700;font-size:13px;margin-top:12px}
.acct{display:grid;gap:10px;margin-top:14px}

   "summary": "After five days, Mr Bepo eventually reveals that he is leaving Nigeria for the United Kingdom as he can no longer withstand the pressure to relocate. His “foot-dragging over the matter had pushed his marriage to the brink.” He did not want to leave his students but his family was also “keen” on his mind. His two children – Nike and Kike – have also joined forces with his wife to force him to relocate.\n\nHe had spent four years as the headmaster at Stardom Kiddies – the nursery/ primary arm of the school and the rest of his time as the principal at the secondary school. It is his years at Stardom Kiddies that earned him the nickname, “The Lekki Headmaster.” The name was actually used first by Mr Audu, who joked about Mr Bepo’s humanistic and empathetic disposition which allowed him to resolve conflicts amicably. He said:\n\n“The way the headmaster masterly resolves these fights reminds me of the way King Oloja, in Village Headmaster, resolved all the roforofos brought by his chiefs and villagers. So, as they had their own Village Headmaster, we also have our own Lekki Headmaster.”\n\n(The Lekki Headmaster, pg. 10)\n\nEven after Bepo became the principal of the secondary school, this nickname stuck. Many of Mr Bepo’s colleagues found his reaction to his relocation abroad extremely funny as it is surprising to see someone who had the “golden opportunity” to relocate abroad be reluctant to do so.\n\nHis wife Seri, is a nurse and is earning up to £10,000 per month and Mr Bepo got a teaching job that pays about £3,600 and other entitlements. All of these would provide him a life that is much better than the one he has in Nigeria where he is paid only about N400,000 per month. Mr Bepo’s colleagues discuss all of these amongst themselves and criticise his reluctance to leave.\n\nBepo planned to retire from Stardom at 55, which is still four years away. He had plans to become a business owner and to “develop fellow men and his country”. Bepo also thought of establishing his school. He recalled what he had learned in one of his entrepreneurship seminars about the importance of starting small. He also knew that it was better to build a school in a place where the residents could afford the kind of education he would provide. He remembered establishing a neighbourhood school – Fruitful Future – with a friend shortly after his National Youth Service. It turned out unsuccessful because the parents in the area could not afford the school.\n\nHe thought about other business ventures like farming, food and sachet (pure) or bottled water businesses. He especially considered the commercial transportation business as he believed that someone with minimal capital could begin it and that it would begin to make money as soon as the vehicle was purchased. However, he was wary about the stories he had heard – about how many commercial drivers are untrustworthy as they come up with different stories so that they can keep the profits for themselves. But, Bepo still kept this option open as he is reminded that if big companies like ABC and God is Good Motors, could operate successfully, there is still an opportunity for him.\n\nHowever, now, he has to set aside those dreams as he would be relocating to a new environment where he would be earning more and sharing a new life with his wife and children.",

   "summary": "Bepo finally resolves to relocate and begins to listen to tales from others who have relocated earlier. He always knew that payment abroad could be hourly, daily, weekly or monthly unlike Nigeria where one-time salaries were more common. He preferred the hourly system which made it easy for the employee to change jobs as often as he wanted and for the employer to closely monitor their employees. It neutralised the Yoruba proverb which is interpreted as “whether an employer records gains or not, the employee will yet take home his full pay.” This, he believed, was why these other countries have developed.\n\nHe heard that one could earn between $150 to $ 250 per day and gather up to $2400 per month. This is a substantial amount compared to the N1600 that Nigerians earn. He also gathered that skilled work was also the best option for those relocating abroad. He learnt that nurses, doctors and other health workers have been migrating at an alarming rate (about 1000 of the country’s 3000 doctors migrate annually). Graduates are also leaving the country through education visas.\n\nHe also observed that some people use crooked means to get the resources needed to “Japa”. He remembered Mr. Nku one of the staff at Stardom who took a N2 million loan from the school’s cooperative and relocated abroad two days later and one of the school’s drivers who tried to sell the school’s bus to pay for his son’s college fees abroad.\n\nSola was one of his colleagues at Stardom who had relocated to the UK with her husband about six months earlier. She reassured Bepo that his settling into the UK would be without stress since his wife was already there. She relates how most couples who migrate have to share the responsibilities – while one works, the other one studies. She also narrates how she and her husband had to sell everything and borrow N4 million to fund their trip.\n\nMost people relocate to the UK because of the opportunity for their children to enjoy quality education. Bepo’s children, Nike and Kike, enjoyed free primary and secondary education and did not have to pay fees until Nike went to university. This is unlike the kids at Stardom who pay millions of naira for their children’s education. Healthcare in the UK was also free, especially for children who enjoy mandatory regular checkups.\n\nHowever, the tales from abroad were not always so good. Jare is a young man who abandoned his banking job and burst into tears when he realised he had to care for an old couple in London. An accountant named Hope who secured admission for a Master’s degree relocated to the UK with his wife. His wife worked to fund his studies. However, after a few months, his wife decided to stop providing for him. All this made Bepo realise that people “always had different results from life’s intriguing tests.” (pg. 17). He recalled a proverb from one of his former Idoma co-tenants about how the sugarcane and the bitter leaf got different tastes from the same rain that nurtured them.\n\nThere was also the question of bringing in dependents from Nigeria. While some are keen on sponsoring their relatives like Riike who invited two of her sisters to the US, others are not ready to.",

  "4": {
   "title": "A Case of Visa Denied",
   "summary": "Bepo is in his room at Adeniyi Jones, Ikeja, Lagos, Mr Bepo receives a call from Mrs Ignatius, the parent of a student, just as he is about to say his night prayers. He was not okay with the overly cordial relationship that Mrs Ignatius was extending towards him. He always related to his students and staff with humour and compassion but he did not appreciate being taken for granted just like Mrs. Ignatius was doing.\n\nMrs Ignatius's husband, Mr Ibe Ignatius, who works as a manager in an oil firm, also decided to “japa” with his family. He argued that he would not want his children to grow up in Nigeria where the children of those who went abroad come to be their children’s leaders and superiors. Mrs Ignatius was in love with this idea and soon started learning tailoring and hairdressing so that she too could earn some money abroad. Mrs Ignatius had quit her job as a clerical officer while her husband had closed up his “clearing and forwarding” side business as they prepared to relocate when something terrible happened.\n\nWhile processing their visa, a DNA test revealed that Mr Ibe is not the father of one of their three children – Favour, an SSS2 girl at Stardom. This is the subject of Mrs Ignatius’ late-night call. Her husband had told them (Mrs Ignatius and Favour) to leave the house. He was not sure how to respond to this situation. He was aware of the fact that some of these rich parents can be selfish and nasty. He is reminded of an incident that led to the sacking of Mr Ayesoro, who was the Government teacher.\n\nOne of his students, Bibi, had a dream about the Government teacher. Bibi told her mother, Mrs Ladele, that the government teacher appeared to her in her dream with his tribal mark. His tribal marks are so deep and prominent that the student nicknamed him Mr Owala, a derogatory Yoruba name for a person with wild facial marks. Every time, Bibi saw Mr Ayesoro, she became scared. The dreams continue until Mrs Ladele goes to the school to file a complaint. Worried that they would lose Bibi and her siblings to another school, the management transferred Mr Ayesoro to Stardom Hub, the property wing of Stardom Group of Companies.",
   "qCount": 10,
   "audioUrl": "4.mp3"
  },
  "5": {
   "title": "Snake in the Roof",
   "summary": "The MD chooses to take a walk rather than retreat to the private room in her office as she always does. She walks towards a piece of land that Stardom had acquired two years ago and that was five minutes away from the school’s back gate. She discovers that the teachers and some other staff are using the land as a park instead of the park allotted to them within the school’s premises. She is shocked by the number of big cars and buses that she sees in the car park.\n\nShe immediately summons the principal and accountant to figure out if the teachers and staff are stealing from the school. When the MD asks how the teachers and staff can afford the cars, the principal advises that they retreat to the office to discuss it. The principal reassures her that the school purse is fine and that the staff had gotten the money through the school’s cooperative.\n\nThe MD inquires further: “How much is in the account of the Stardom Cooperative Society that it could buy every fool the car of his or her choice?” Her choice of words shock both men. The following day, she called for a meeting of the board of directors where she was able to ascertain that the Cooperative society had N95 million, while over N50 million had been loaned out. The MD shares her concern about how the staff can use that money to establish their school and steal their brand. She uses the simile: “It’s like hanging a snake in the roof and going to bed.” The board eventually reached a decision, that no staff member could borrow more than N250,000, that all loan requests had to be approved by the MD and that the management must be informed about the cooperative’s elections.",
   "qCount": 10,
   "audioUrl": "5.mp3"
  },
  "6": {
   "title": "Ade as Well as Jide COMES vs. COME",
   "summary": "It is Open Day at Stardom Schools. The teachers at Stardom look forward to gifts from parents that come in cash and kind, especially the class teachers. Some teachers also dread Open Day because parents often come with a lot of complaints. Mr Bepo recalls an episode where an English teacher, Mr Fafore was sacked for a trivial complaint made by a parent – Mr Guta. Mr Guta was in the MD’s office asking for Mr Fafore to be sacked.\n\nHe recalls several other incidents where teachers were sacked. Some who were sacked were guilty and others were just “victims of circumstance or even conspiracy.” He always felt bad whenever he had to write a sack letter. He understands what can drive people to do things like this. He recalls an incident a long time ago when he was out of a job and had no savings. He ‘ate’ the N2,500 electricity tariff he had collected on behalf of the tenants and lied that he had paid it. However, the truth came out when the NEPA officials cut them off. The tenants mocked the “Oga Tisa” and disgraced him in front of everyone.\n\nMr Bepo was instructed to send for Mr Fafore who was teaching a class. Mr Bepo was not okay with calling a teacher out of the class as it left the students idle. Mr Fafore could have given the notes to the class prefect so that the students could continue copying the notes but this practice has been discontinued because a parent had sued the school because of this. They had no other option than to leave the student idle.\n\nWhile they walked to the MD’s office, the principal questioned Mr Fafore to know why he was about to be sacked but Mr Fafore was clueless as well. He then asked if he argued with Mr Guta but Mr Fafore responded that Mr Guta only walked into the class, checked his son’s books and said nothing before he left abruptly. Mr Bepo broke the news that he had been sacked, and Mr Fafore left for the staff room, devastated. He went to the staff room to collect his personal items where his fellow teachers had heard the news. The teachers concluded that “there was no job security in the establishment.”\n\nAt a meeting that occurred immediately after, the MD revealed to the teacher why Mr Fafore was fired. Mr Guta had discovered a grammatical error in his son’s note: “Ade as well as Jide comes early”. This made him so angry that he threatened to withdraw his children from the school. She says that the sentence should read: “Ade as well as Jide come early.” The principal responded to the MD’s fiery speech about Mr Fafore’s incompetence by saying that the sentence Mr Fafore taught was correct. He said:\n\n“When you use ‘and’, the verb that follows is ‘come’. But when you use ‘as well as’, ‘together with’, ‘alongside’, etc., we fo for the singular verb with ‘s’. The clause is in the subjunctive mood and does not align with normal grammar rules.”\n\n(The Lekki Headmaster, pg. 33)\n\nNot satisfied with the principal’s explanation, she directed everyone to look it up on their phones. They all discover that both Fafore and the principal are right. The MD felt deflated having sacked a hardworking teacher but Mr Audu breaks the ice with a joke. Eventually, she reemploys Mr Fafore.",
   "qCount": 10,
   "audioUrl": "6.mp3"
  },
  "7": {
   "title": "Ritualists",
   "summary": "Bepo recalls joining Stardom schools after a disagreement that he had at his former school – Beesway Group of School, located on the outskirts of Lagos. He tried to correct the grammatical error in the name. He pointed out that the school ought to be called “Beesway Group of Schools.” The director, Mr Egi Meko thanked him mockingly knowing fully well that he would not change the name. He claims that the name was divinely inspired and that no one was complaining about the name.\n\nBepo tried to raise this issue countless times but to no avail. Eventually, a couple of parents raised the same issue at one of the PTA meetings. The director calls him to his office and accuses him of telling the parents about the error in the school’s name. Bepo argues that he had done no such thing. Bepo eventually leaves the school after an incident that he considers to be ungodly occurs.\n\nOne night, while in his room at Beesway Staff Quarters, he noticed something strange going on far in the distance. He discovered a group of five men, one of them was holding a cow by a leash. Two men emerged from a pit and were leading the cow into the pit. Immediately, Bepo grabs his machete and heads out towards the men. He soon discovered that the Director was among the group. Bepo protested that they should not be burying a cow while the director warned him to go away.\n\nWhen he did not listen, one of the men hit him on the head from behind and Bepo fell on his back. Before his accomplice can do some damage, the director quickly pacifies them and helps Bepo back up. He takes Bepo back to his room before he continues to complete his “dark assignment.” Bepo was shocked by the entire ordeal, He had heard tales of rituals carried out by school owners and patrons of other businesses.\n\nHe recalled when he started “Fruitful Future School” with his colleague. The school he had built was flourishing for a while as the number of pupils had grown to over 70 in the third session. One day, one of the parents, Mr Ogo, walks into his office to suggest that he “perform a rite that would supernaturally flood the school with pupils in no time.” (pg. 38). Bepo chooses not to do this and Mr Ogo withdrew his child from the school afterwards. Soon, the school shut down after its neighbourhood was deserted by those who could afford the school fees because its roads became bad.\n\nTen years later, Bepo discovers that Mr Ogo murdered a civil servant, a woman who had consulted him for a spiritual solution to her infertility. She had paid him N9 million naira over a year and nothing happened. The woman asked for a refund and threatened to arrest him if he did not pay up. Eventually, he murdered her after inviting her to his home.\n\nBepo thought of reporting the Beesway Director but he knew nothing would come of it. The next morning, Bepo got a call from the Director to see him in his office. Before he went to the director’s office, he moved his belongings out of his room and the staff room. The director apologised for the assault he suffered and claimed that the scene of the previous night was part of a special prayer for his late father, who had given him the land on which the school was built.",
   "qCount": 10,
   "audioUrl": "7.mp3"
  },
  "8": {
   "title": "Missions Unaccomplished",
   "summary": "Bepo wishes to resolve a legal tussle between the families of two of his pupils that has been going on for three years before relocating to the UK. The school had conducted an election for a new set of prefects. The contestants bought forms depending on the positions they wished to contest for. Forms for the position of Head Boy and Head Girl was N50,000, N40,000 for the deputies and N25,000 for all other positions.\n\nAfter purchasing the forms, they would be screened by a panel constituted by the management. The screening ensured that participants were above average academically and that they had a good moral history, especially in the school. The students read out their Expression of Interest letter to the panel and their power of communication was gauged. When they scaled through, the successful candidates were revealed to the students so that they could get familiar with them and raise any objections through letters to the panel. The names were pasted on the notice board for two weeks after which the candidates would address the students on the “much anticipated Speech Day.” The election was then held the next day.\n\nOn Speech Day, however, something terrible happened: Banky, an SSS2 student vying for the post of Social Prefect, during her speech says: “Instead of voting for the son of an ex-convict, cast your vote for me. You will never regret it.” He said this about her key opponent, Tosh who is also in SSS2. Before the principal could disapprove of these words, Tosh walked out of the hall. Banky and Tosh have always had a rivalry since they were in JSS3. Their parents have also joined in on this rivalry. They filed a lawsuit against Tosh.\n\nTosh’s father, Chief Ogba, was not an ex-convict but he had spent 36 months in detention as a faced trial for alleged misappropriation of N2.5 billion government contract sum. The case dragged on for five years but he was released and was ordered to refund the sum. Chief Ogba insisted that Banky and his parents write letters of apology to himself and his son and that the letters be published in the school magazine but Banky's parents declined to do this.\n\nBepo is hoping that he could get the warring parties to settle out of court before he relocated. He is also upset that he would miss the Invention Club, especially the Breath Project – the club that made phones out of recycled panels and chips. The project had attracted media and government interest. He fears that if he left Nigeria, the project could derail. He promised he would do everything he could to fly in from the UK to be part of the launch.",
   "qCount": 10,
   "audioUrl": "8.mp3"
  },
  "9": {
   "title": "Laughing Waterfalls",
   "summary": "Stardom is especially known for planning great excursions. Mr Bepo ensures that an excursion takes place every year so that the students have a good grasp of their country before they are sent abroad. The students visited places like the Ikogosi Warm Springs in Ekiti State, Erin Ijesha Waterfalls in Osun State and the Owu Waterfalls in Kwara which is the highest in West Africa, measuring 120 meters above water level and cascading 330 feet down an escarpment. The students also went down to the Gurara Falls in Niger State.\n\nStardom also plans to visit other waterfalls, like the Kwa Falls in Anegeje, Calabar, Aesop in Plateau, Karu in Nasarawa and Barup in Gembu, Taraba. Stardom had also visited the Yakari Games Reserve in Bauchi, the National War Museum in Umuahia, Abia, the Hanging Lake in Ado Awaye, Oyo State, the amazing Kano Palace and the Ooni of Ife Palace in Ile-Ife.\n\nThe students have also attended several festivals including the Calabar Carnival, Osun Osogbo Festival, Argungu Festival in Kebbi and the Ofala Festival in Onitsha. They also visited several sites in Lagos such as the National Theatre in Iganmu, Surulere, the National Museum, the MUSON Centre and City Mall, all in Onikan as well as so many other places. When the students visited areas like Mushin, Ajegunle and Ijora, they were filled with derision. But, Mr Bepo told them:\n\n“If you are determined, committed to education, and make the best use of your talent, time will move you from slum to limelight. You will be surprised to learn that many of those you see on Banana Island started off in slums somewhere in the country. Life is about movement; it is ever ready to move upward folks who make the best use of their talents, money and opportunities.”\n\n(The Lekki Headmaster, pg. 46)\n\nThey also visited the Akran of Badagry who narrated the history of Badagry and slave trade in the region to the students. One of the students asked the Akran if it was true that the name “Badagry” was derived from Agbadarigi. The monarch confirmed this to be true. They visited so many other monuments of the slave trade and missionary activities in Badagry. Mr Bepo was exceptionally moved by the memory of the ugly experience the slaves went through as he was at the Black Heritage Museum.\n\nHe especially drew out the irony in the fact that Africans themselves are now voluntarily moving into the workforce of those who seem to be their former masters all in a bid to “japa.” He saw this as a new slavery.",
   "qCount": 10,
   "audioUrl": "9.mp3"
  },
  "10": {
   "title": "Passport Pains",
   "summary": "Mr Bepo’s passport had expired two years earlier and he did not bother to renew it as he had not been too keen on relocating. He was also afraid of going to renew it as he had heard tales of the new rules and hassles that applicants were experiencing. However, when he realises that he has no other option than to renew it, he is not ready to face the hassles and so he explores other options.\n\nHe realises that he could bribe an immigration officer but he would require up to N200,000 to N250,000 and could have his passport renewed in less than a month. He could also travel to the Immigration Service in any neighbouring state. He eventually chooses to go to Ibadan. Although the law states that the process could be done online or manually without the use of “middlemen”, he is told by an agent in Ibadan that this law existed only on paper.\n\nAt first, Bepo speaks with the agent, Tai, on the phone where he is told to pay N1,000,000 for a 10-year renewal (64 pages) instead of the official N70,000. He sets off on the journey to Ibadan on a Tuesday afternoon so that he would be able to meet up with Tai by 7:00 am the next day as discussed on the phone. The journey to Ibadan is stress-free and takes only 50 minutes as opposed to the one he had with his students on an excursion about 10 years ago which took about two hours.\n\nOn the road, he observes a lot of churches and mosques. He finds it ironic that Nigeria has “many religionists but few godly people” Bepo retrains himself thinking this to be a judgemental thought. He also notices a lot more businesses along the expressway. As the Sienna car, he rode on enters Ibadan, he is fascinated by the phenomenal Ibadan landscape. He is reminded of the poem “Ibadan” by J.P. Clark.\n\nHe arrives at the Immigration office around 6:40 am the following day. He discovers that Tai is not an immigration personnel but a business centre operator working in cahoots with some immigration staff. Tai gives Bepo all the necessary data and sends him off to the official that he works with. The official takes the document in for validation and tells Bepo to return for data capturing in three weeks. Bepo is surprised that the exercise was so fast and the officer tells him that this is why he paid extra. Bepo gives him a N2,000 tip.",
   "qCount": 10,
   "audioUrl": "10.mp3"
  },
  "11": {
   "title": "Point of No Return",
   "summary": "The school has come to terms with Mr Bepo’s leaving and has prepared a Farewell celebration for him. He has to delay his flight plan to be able to attend the farewell. The airline charged him a $100 fine for cancellation which the school was glad to pay on his behalf.\n\nThe farewell begins on a Wednesday with a hilarious match between the staff and students. With the help of Mr Ibe, the games master, the staff win fraudulently with a score of 3-2. On Thursday, a debate is held in his honour. The topic was: The arts have contributed more to the development of the country than the sciences. At the end of the debate, he is enamoured by the brilliance and candour of his students and he remembers the old Yoruba adage which translates as: even if Onirese, the master carver, eventually bows out of the trade, the carvings he had bequeathed to the world will live on.\n\nFriday is the grand finale of the Send-off. There were a lot of performances including song presentations, comedic performances where they mimicked the teachers and a string of dances from the drama club. As the drama club presents a dance about their experience in Badagry, Mr Bepo becomes emotional as is taken back to the Heritage Slavery Museum. He does not realise when he yells out: “Noooo!”. The performance stops and everyone begins to stir at him. He immediately comports himself and saves face by retorting: “I mean no school could have done the Canoe dance better. None! None at all!” (pg. 56). The audience applauds.\n\nIn the end, the MD offers a heartfelt speech narrating how Mr Bepo, who is now referred to by his full name – Adewale Adebepo – was hired by her father who knew he would be a valuable addition to the school. She showers a lot of praise on him and eventually offers him a farewell gift in an envelope. The MD reveals that it contains a cheque of $10,000 – the highest Stardom had ever presented to a disengaging member of staff.\n\nThen, Mr Bepo is given the microphone to offer his speech. He does this amidst sobbing which the audience understood.",
   "qCount": 10,
   "audioUrl": "11.mp3"
  },
  "12": {
   "title": "...Dawn",
   "summary": "Mr Bepo is set to leave on a flight by 10:00 pm on a Saturday and boarding rites are set to begin around 5:00 pm. He chooses to leave around 3:00 pm. As he is about to call an Uber, his landlord, Mr Ogunwale, and his family come to bid their farewells. The landlord offers to drive him to the airport.\n\nMr Ogunwale offers a brief prayer for the traveller and then proceeds to drive his Honda Pilot out of the garage. Mr Bepo packed two big bags and a smaller one. His wife had advised him to travel light but not to forget essential items like iru (locust beans) and egusi with ground crayfish and dry snail. He found all of these at the famous Oyingbo market.\n\nBepo had sold his car for N1.5 million to the Stardom School’s accountant and had gifted his electronics to the landlady. As they drive to the Murtala Muhammed Airport, they meet the Vice Principal, Mrs Grace Apeh, the accountant, Mr Oyelana and Mr Audu along the road. They had planned to accompany him to the airport.\n\nAt the airport, the Stardom staff follow him to the check-in point where they go through the security points and get his bags checked. The staff has to bid farewell as they depart to beat the Lagos traffic. As he settles down waiting for the boarding call, he falls asleep and dreams that he is at the Heritage Museum in Badagry where he is counting the slaves who are beaten and then forced to enter the ship at the Point of No Return. He counts the slaves, all 7 million of them and at the end, a white man tells him to enter the ship. He yells: “Noooo!” This is when an airline official gently tapped on his shoulder. It is time for him to get on board the plane.\n\nThe Monday after Mr Bepo’s departure, the students and the MD feel the impact of his absence. However the MD assures the students that they would get another principal. But just before the MD could say more, the students draw her attention to Bepo who has returned. The students immediately sweep him off his feet as he tells them that he is back and that he is not leaving as he is going to complete his mission. His voice is barely heard as the students chant the school’s victory song.",
   "qCount": 10,
   "audioUrl": "12.mp3"
  }
 },

var LK={chapters:null,cast:null,themes:null,fresh:false,loading:false,q:{}}, LKC='zhub_lekki_v1', lkTab='chapters', lkChap=1, lkCastCh=0, lkCastQ='', LQ=null, lqTick=null;
var LK_PRESETS=[5,10,15,20,30];
function LKS(){return S.lekki||(S.lekki={})}
function lkCh(n){var o=Object.assign({},LK_SEED.chapters[n]||{}),f=(LK.chapters&&LK.chapters[String(n)])||{};Object.keys(f).forEach(function(k){if(f[k]!==''&&f[k]!=null)o[k]=f[k]});return o}
function lkCast(){return (LK.cast&&LK.cast.length)?LK.cast:LK_SEED.cast}
function lkThemes(){return (LK.themes&&LK.themes.length)?LK.themes:LK_SEED.themes}
function lkMins(){var m=Math.round(+S.lkMin||10);return Math.max(1,Math.min(120,m))}

/* show saved content instantly, then refresh from Firestore once per visit */
function lkLoad(){
  if(LK.chapters===null){try{var c=JSON.parse(localStorage.getItem(LKC));if(c){LK.chapters=c.chapters||{};LK.cast=c.cast||null;LK.themes=c.themes||null}}catch(e){}}
  if(LK.fresh||LK.loading||!user) return;
  LK.loading=true;
  Promise.all([db.collection('lekkiChapters').get(),db.collection('lekkiMeta').doc('cast').get(),db.collection('lekkiMeta').doc('themes').get()]).then(function(r){
    var ch={}; r[0].docs.forEach(function(d){ch[d.id]=d.data()});
    LK.chapters=ch; LK.cast=r[1].exists?(r[1].data().items||[]):null; LK.themes=r[2].exists?(r[2].data().items||[]):null; LK.fresh=true; LK.loading=false;
    try{localStorage.setItem(LKC,JSON.stringify({chapters:ch,cast:LK.cast,themes:LK.themes}))}catch(e){}
    lkRerender();
  }).catch(function(e){LK.loading=false;console.error('lekki load',e);if(LK.chapters===null)LK.chapters={};lkRerender()});
}
function lkRerender(){
  if($('view-lekki').classList.contains('active')) drawLekki();
  if($('view-lchapter').classList.contains('active')) drawLChapter();
}
function paras(t){return String(t||'').split(/\n\s*\n/).map(function(x){return x.trim()}).filter(Boolean).map(function(x){return '<p>'+esc(x).replace(/\n/g,'<br>')+'</p>'}).join('')}

/* ---- home: chapters / characters / themes ---- */
function renderLekki(){ S.lkVisited=true; persist(); lkLoad(); drawLekki(); drawAcct(); }
function lkTabSet(t){lkTab=t;drawLekki()}
function drawLekki(){
  ['chapters','cast','themes'].forEach(function(k){$('lk-t-'+k).classList.toggle('on',lkTab===k)});
  var el=$('lk-body'), h='';
  if(lkTab==='chapters'){
    for(var n=1;n<=12;n++){
      var d=lkCh(n), pr=LKS()[n], tags=[], lk=lkLocked(n);
      if(d.summary) tags.push('Summary'); if(d.audioUrl) tags.push('Audio'); if(d.qCount) tags.push(Math.min(20,d.qCount)+' questions');
      var line=(tags.length?tags.join(', '):'Coming soon')+(pr?'. Best '+pr.best+'/'+pr.total:'');
      h+='<button class="tcard" onclick="nav(\''+('#/lekki/ch/'+n)+'\')" style="margin-bottom:10px"><span class="tnum">'+(lk?'<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-lock"/></svg>':n)+'</span><span class="tinfo"><h3>'+esc(d.title||'Chapter '+n)+'</h3><p>'+esc(line)+'</p></span><svg class="chev" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-chev"/></svg></button>';
    }
    el.innerHTML='<div style="margin-top:12px">'+h+'</div>';
  } else if(lkTab==='cast'){
    var chips='<button class="stab '+(lkCastCh===0?'on':'')+'" onclick="lkCastSet(0)">All</button>';
    for(var c=1;c<=12;c++) chips+='<button class="stab '+(lkCastCh===c?'on':'')+'" onclick="lkCastSet('+c+')">Ch '+c+'</button>';
    el.innerHTML='<div style="margin-top:16px"><input class="field" id="lk-q" placeholder="Search a character" oninput="lkCastQ=this.value.trim().toLowerCase();lkCastList()" value="'+esc(lkCastQ)+'"><div class="chips" style="margin-top:12px">'+chips+'</div><div id="lk-castlist"></div></div>';
    lkCastList();
  } else {
    var th=lkThemes();
    var out='', lastG=null;
    th.forEach(function(t){
      if(t.group&&t.group!==lastG){out+='<h2>'+esc(t.group)+'</h2>';lastG=t.group}
      out+='<div class="cast"><div class="nm2">'+esc(t.name)+'</div><div class="tx">'+paras(t.desc)+'</div></div>';
    });
    el.innerHTML='<div style="margin-top:4px">'+(th.length?out:'<div class="empty z"><h3>Themes coming soon</h3><p>The main themes of the novel will appear here.</p></div>')+'</div>';
  }
}
function lkCastSet(n){lkCastCh=n;drawLekki()}
function lkCastList(){
  var all=lkCast(), el=$('lk-castlist'); if(!el) return;
  if(!all.length){el.innerHTML='<div class="empty z"><h3>Characters coming soon</h3><p>The full cast from Chapter 1 to Chapter 12 will appear here.</p></div>';return}
  var list=all.filter(function(c){return (!lkCastCh||(c.chapters||[]).indexOf(lkCastCh)>=0)&&(!lkCastQ||((c.name||'')+' '+(c.role||'')+' '+(c.desc||'')).toLowerCase().indexOf(lkCastQ)>=0)});
  el.innerHTML=list.length?list.map(function(c){return '<div class="cast"><div><span class="nm2">'+esc(c.name)+'</span>'+(c.role?'<span class="rl">'+esc(c.role)+'</span>':'')+'</div>'+(c.desc?'<p>'+esc(c.desc)+'</p>':'')+((c.chapters&&c.chapters.length)?'<div class="cc">Appears in chapter'+(c.chapters.length>1?'s':'')+' '+c.chapters.join(', ')+'</div>':'')+'</div>'}).join(''):'<div class="empty"><p>No character matches that.</p></div>';
}

/* ---- one chapter: summary, audio, who is in it, timed quiz ---- */
function renderLChapter(){ lkLoad(); drawLChapter(); }
function drawLChapter(){
  var n=lkChap, d=lkCh(n), pr=LKS()[n];
  $('lc-h').textContent='Chapter '+n; $('lc-sub').textContent=d.title||'';
  var who=lkCast().filter(function(c){return (c.chapters||[]).indexOf(n)>=0});
  var qn=Math.min(20,d.qCount||0), h='';
  h+='<h2>Summary</h2>'+(d.summary?'<div class="summary">'+paras(d.summary)+'</div>':'<div class="empty"><p>The summary for this chapter is coming soon.</p></div>');
  h+='<h2>Listen</h2>'+(d.audioUrl?'<div class="panel" style="margin-top:0"><p style="margin:0 0 4px">Audio summary of Chapter '+n+'</p><audio controls preload="none" src="'+esc(d.audioUrl)+'"></audio></div>':'<div class="empty"><p>Audio for this chapter is coming soon.</p></div>');
  if(who.length) h+='<h2>Characters in this chapter</h2>'+who.map(function(c){return '<div class="cast"><div><span class="nm2">'+esc(c.name)+'</span>'+(c.role?'<span class="rl">'+esc(c.role)+'</span>':'')+'</div>'+(c.desc?'<p>'+esc(c.desc)+'</p>':'')+'</div>'}).join('');
  h+='<h2>Test yourself</h2>';
  if(!qn) h+='<div class="empty"><p>The quiz for this chapter is coming soon.</p></div>';
  else h+=zenSayHtml('Read the summary and listen to the audio first, then test yourself. Choose as many minutes as you need.')+'<div class="panel live" id="lk-qpanel"></div>';
  h+='<div class="chnav">'+(n>1?'<button class="btn ghost" onclick="nav(\'#/lekki/ch/'+(n-1)+'\')">&#8249; Chapter '+(n-1)+'</button>':'<span></span>')+(n<12?'<button class="btn ghost" onclick="nav(\'#/lekki/ch/'+(n+1)+'\')">Chapter '+(n+1)+' &#8250;</button>':'<span></span>')+'</div>';
  $('lc-body').innerHTML=h;
  if(qn) drawQPanel(qn,pr);
}
function drawQPanel(qn,pr){
  var m=lkMins();
  $('lk-qpanel').innerHTML='<h3>'+qn+' question'+(qn===1?'':'s')+'</h3><p>'+(pr?'Your best: '+pr.best+'/'+pr.total+'. ':'')+'Choose how many minutes you want.</p>'+
    '<div class="mins" id="lk-mins">'+LK_PRESETS.map(function(x){return '<button class="stab '+(x===m?'on':'')+'" onclick="lkMinSet('+x+')">'+x+' min</button>'}).join('')+'</div>'+
    '<div class="minput"><label for="lk-min" style="margin:0">Or type your own</label><input class="field" id="lk-min" type="number" inputmode="numeric" min="1" max="120" value="'+m+'" oninput="lkMinInput(this.value)"><span class="muted" style="font-size:13px">minutes</span></div>'+
    '<button class="btn full" onclick="lkStart()">Start quiz</button>';
}
function lkMarkMins(){var m=lkMins(),b=document.querySelectorAll('#lk-mins .stab');for(var i=0;i<b.length;i++)b[i].classList.toggle('on',parseInt(b[i].textContent,10)===m)}
function lkMinSet(m){S.lkMin=m;persist();var i=$('lk-min');if(i)i.value=m;lkMarkMins()}
function lkMinInput(v){var m=Math.round(+v);if(m>=1){S.lkMin=Math.min(120,m);persist()}lkMarkMins()}

/* ---- the quiz ---- */
function lkStart(){
  var n=lkChap, mins=lkMins();
  if(lkLocked(n)){nav('#/lekki/premium');return}
  if(anyExam()){toast('Finish or resume your current exam first.');return}
  var get=LK.q[n]?Promise.resolve(LK.q[n]):(db?db.collection('lekkiQuestions').doc('ch'+n).get():Promise.reject()).then(function(d){return d.exists?(d.data().questions||[]):[]}).catch(function(){return []}).then(function(l){return (l&&l.length)?l:((LK_SEED.questions&&LK_SEED.questions[n])||[])});
  toast('Loading questions...');
  get.then(function(list){
    LK.q[n]=list;
    var qs=list.filter(function(q){return q&&q.q&&q.opts&&q.opts.length>1}).slice(0,20);
    if(!qs.length){toast('The questions for this chapter are coming soon.');return}
    LQ={active:true,ch:n,qs:qs,ans:new Array(qs.length).fill(null),idx:0,mins:mins,startAt:Date.now(),endAt:Date.now()+mins*60000};
    clearInterval(lqTick); lqTick=setInterval(lqT,1000); nav('#/lekki/quiz');
  }).catch(function(e){console.error(e);toast("Couldn't load the questions. Check your connection and try again.")});
}
function lqStop(){clearInterval(lqTick);LQ=null}
function lqQuit(){ if(confirm('Quit this quiz? Your answers will be lost.')){var n=LQ?LQ.ch:lkChap;lqStop();nav('#/lekki/ch/'+n)} }
function lqT(){
  if(!LQ||!LQ.active) return; var rem=Math.max(0,Math.round((LQ.endAt-Date.now())/1000)), t=$('lq-timer');
  t.textContent=pad(Math.floor(rem/60))+':'+pad(rem%60); t.classList.toggle('low',rem<=30);
  if(rem<=0){clearInterval(lqTick);lqFinish(true)}
}
function renderLQ(){
  if(!LQ) return; var q=LQ.qs[LQ.idx];
  $('lq-sj').textContent='Chapter '+LQ.ch; lqT();
  $('lq-meta').textContent='Question '+(LQ.idx+1)+' of '+LQ.qs.length;
  $('lq-q').innerHTML=rich(q.q);
  $('lq-prog').style.width=Math.round((LQ.idx+1)/LQ.qs.length*100)+'%';
  $('lq-opts').innerHTML=q.opts.map(function(o,i){return '<button class="opt '+(LQ.ans[LQ.idx]===i?'sel':'')+'" onclick="lqPick('+i+')"><span class="l">'+String.fromCharCode(65+i)+'</span><span>'+rich(o)+'</span></button>'}).join('');
  $('lq-prev').style.visibility=LQ.idx===0?'hidden':'visible';
  $('lq-next').textContent=LQ.idx===LQ.qs.length-1?'Finish':'Next';
}
function lqPick(i){LQ.ans[LQ.idx]=i;renderLQ()}
function lqPrev(){if(LQ.idx>0){LQ.idx--;renderLQ();window.scrollTo(0,0)}}
function lqNext(){
  if(LQ.idx<LQ.qs.length-1){LQ.idx++;renderLQ();window.scrollTo(0,0);return}
  var left=LQ.ans.filter(function(a){return a===null}).length;
  if(!left){lqFinish(false);return}
  openSheet('<h3>Finish the quiz?</h3><p class="why">You have <b>'+left+' unanswered</b> question'+(left>1?'s':'')+'. You can go back and answer them, or finish now.</p><div class="acct"><button class="btn full" onclick="lqFinish(false)">Finish now</button><button class="btn ghost full" onclick="closeSheet()">Keep going</button></div>');
}
function lqFinish(auto){
  clearInterval(lqTick); if(!LQ) return; closeSheet(); var s=LQ, c=0;
  s.qs.forEach(function(q,i){if(s.ans[i]===q.a)c++});
  var total=s.qs.length, pct=Math.round(c/total*100), used=Math.min(s.mins*60,Math.max(0,Math.round((Date.now()-s.startAt)/1000)));
  var st=LKS(), rec=st[s.ch]||{best:0,total:total,tries:0};
  rec.tries=(rec.tries||0)+1; rec.last=c; rec.date=new Date().toISOString();
  if(!rec.total||pct>=Math.round((rec.best||0)/(rec.total||1)*100)){rec.best=c;rec.total=total}
  st[s.ch]=rec;
  S.lkLast={ch:s.ch,c:c,total:total,pct:pct,used:used,mins:s.mins,qs:s.qs,ans:s.ans};
  LQ=null; persist(); cloud();
  if(auto) toast("Time's up. Your quiz was submitted.");
  nav('#/lekki/results');
}
function renderLResults(){
  var r=S.lkLast; if(!r) return;
  $('lr-sub').textContent='Chapter '+r.ch+(lkCh(r.ch).title?': '+lkCh(r.ch).title:''); $('lr-score').textContent=r.c+'/'+r.total;
  $('lr-msg').textContent=r.pct>=70?'Strong result. You know this chapter.':r.pct>=40?'Good effort. Read the summary once more.':'Read the summary and listen to the audio, then try again.';
  $('lr-zen').innerHTML=zenSayHtml(zenMsg(r.pct,'')); $('lr-pct').textContent=r.pct+'%'; $('lr-c').textContent=r.c; $('lr-t').textContent=Math.floor(r.used/60)+'m '+pad(r.used%60)+'s';
  $('lr-next').style.display=r.ch<12?'block':'none';
  $('lr-rev').innerHTML=r.qs.map(function(q,i){var ua=r.ans[i];
    return '<div class="rev"><div class="q">'+(i+1)+'. '+rich(q.q)+'</div>'+q.opts.map(function(o,j){var c=j===q.a?'correct':(j===ua?'wrong':'');return '<div class="o '+c+'">'+String.fromCharCode(65+j)+'. '+rich(o)+'</div>'}).join('')+(ua==null?'<div class="d muted" style="font-size:12px;margin-top:8px">You skipped this one.</div>':'')+(q.exp?'<div class="ex">'+esc(q.exp)+'</div>':'')+'</div>'}).join('');
}
function lkBackToChapter(){nav('#/lekki/ch/'+(S.lkLast?S.lkLast.ch:lkChap))}
function lkNextChapter(){nav('#/lekki/ch/'+Math.min(12,(S.lkLast?S.lkLast.ch:lkChap)+1))}
function lkRetry(){ if(!S.lkLast) return; lkChap=S.lkLast.ch; lkStart() }


/* =================== The Lekki Headmaster: premium (Chapter 1 free, 2 to 12 paid) =================== */
function lkLocked(n){return false}


/* =================== Zen, the study buddy =================== */
function zenSayHtml(msg){return '<div class="zensay"><span class="zen zen-md"></span><div class="bub">'+esc(msg)+'</div></div>'}
function zenMsg(pct,kind){
  if(kind==='challenge') return 'Well done for finishing! Final rankings come out after the challenge closes.';
  if(pct>=70) return 'Brilliant work! You really know this one. Check your corrections for the few you missed.';
  if(pct>=40) return 'Good effort! Go through your corrections, then try again to beat your score.';
  return "Don't worry, everyone starts somewhere. Read your corrections, practise again and you will improve.";
}

route();
</script>

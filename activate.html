<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap');

  :root{
    --navy-deep: #05112A;
    --navy: #0B1F3A;
    --blue: #2E6BE0;
    --blue-light: #E9F0FE;
    --white: #FFFFFF;
    --ink-soft: #5B6B85;
    --line: #E4E9F2;
    --gold: #F5A623;
    --red: #D6493A;
    --green: #1C9B5E;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  body{
    font-family:'Plus Jakarta Sans', sans-serif;
    background:var(--white);
    color:var(--navy);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  a{ text-decoration:none; color:inherit; }

  header{ border-bottom:1px solid var(--line); }
  .nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 24px;
    max-width:1080px;
    margin:0 auto;
  }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.05rem; }
  .brand-mark{
    width:32px; height:32px;
    object-fit:contain;
    flex-shrink:0;
  }

  main{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:56px 20px 70px;
    min-height:calc(100vh - 68px);
  }

  .card{
    width:100%;
    max-width:420px;
    text-align:center;
  }

  .icon-badge{
    width:64px; height:64px;
    border-radius:18px;
    background:var(--blue-light);
    display:flex; align-items:center; justify-content:center;
    font-size:1.7rem;
    margin:0 auto 20px;
  }

  .card h1{
    font-size:1.55rem;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .card .sub{
    margin-top:10px;
    color:var(--ink-soft);
    font-size:0.97rem;
    line-height:1.5;
  }
  .card .sub .who{
    color:var(--navy);
    font-weight:700;
  }

  .field{ margin-top:28px; text-align:left; }
  .field label{
    display:block;
    font-size:0.86rem;
    font-weight:600;
    color:var(--navy);
    margin-bottom:6px;
  }
  .pin-input{
    width:100%;
    padding:15px 16px;
    border:1px solid var(--line);
    border-radius:10px;
    font-family:inherit;
    font-size:1.15rem;
    font-weight:700;
    letter-spacing:0.25em;
    text-align:center;
    text-transform:uppercase;
    color:var(--navy);
    background:#FAFBFD;
    transition:border-color .15s ease, background .15s ease;
  }
  .pin-input:focus{
    outline:none;
    border-color:var(--blue);
    background:#fff;
    letter-spacing:0.3em;
  }
  .pin-input.err{ border-color:var(--red); }

  .msg{
    margin-top:16px;
    padding:11px 14px;
    border-radius:10px;
    font-size:0.87rem;
    display:none;
    text-align:left;
  }
  .msg.error{ background:#FDECEA; color:var(--red); display:block; }
  .msg.success{ background:#E8F7EF; color:var(--green); display:block; }

  .btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    font-family:inherit;
    font-weight:700;
    font-size:0.98rem;
    cursor:pointer;
    transition:background .15s ease, opacity .15s ease, transform .15s ease;
  }
  .btn-primary{
    margin-top:22px;
    background:var(--navy);
    color:#fff;
  }
  .btn-primary:hover{ background:var(--blue); }
  .btn-primary:disabled{ opacity:0.6; cursor:not-allowed; }

  .btn-gold{
    background:var(--gold);
    color:var(--navy-deep);
    box-shadow:0 12px 26px -10px rgba(245,166,35,0.55);
  }
  .btn-gold:hover{ transform:translateY(-2px); }

  .btn-outline{
    margin-top:14px;
    background:#fff;
    color:var(--navy);
    border:1px solid var(--line);
  }
  .btn-outline:hover{ background:#FAFBFD; }

  .success-state{ display:none; }
  .success-icon{
    width:64px; height:64px;
    border-radius:50%;
    background:#E8F7EF;
    color:var(--green);
    display:flex; align-items:center; justify-content:center;
    font-size:1.8rem;
    margin:0 auto 18px;
  }

  .no-code{ display:none; }

  @media (max-width:480px){
    .card h1{ font-size:1.35rem; }
  }
</style>
</head>
<body>

<header>

  const activateState = document.getElementById('activateState');

  // Require login before activating a pin

      window.location.href = 'login.html';

    }

    formMsg.className = 'msg ' + type;
  }

    e.preventDefault();
    formMsg.className = 'msg';
    pinInput.classList.remove('err');

    const code = pinInput.value.trim().toUpperCase();
    if(!code){
      pinInput.classList.add('err');
      showMsg('Please enter your activation pin.', 'error');
      return;
    }
    if(!currentUser){
      showMsg('Please log in first.', 'error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Activating…';

    // Pure frontend check — no Firebase involved, nothing to wait on.
    if (!PIN_CODES.includes(code)) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Activate Premium';
      pinInput.classList.add('err');
      showMsg('That pin was not recognized. Please check and try again.', 'error');
      return;
    }

    // Mark this account as premium, locally — instant, nothing to wait on.
    const cached = JSON.parse(localStorage.getItem('zenova_user') || '{}');
    cached.premium = true;
    localStorage.setItem('zenova_user', JSON.stringify(cached));

    // Sync to the cloud in the background so it follows them to other
    // devices too. Not awaited — the student never waits on this.
    db.collection('users').doc(currentUser.uid).set({
      premium: true,
      premiumActivatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).catch((err) => console.warn('Cloud sync failed (non-blocking):', err));

    activateState.style.display = 'none';
    successState.style.display = 'block';
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1400);
  });
